# Template for the server's /data/apps/limen/docker-compose.yml (Moli standard 005).
# The administrator keeps the real file on the server; the deploy only rewrites .tag, which
# holds APP_TAG=<commit sha>. Start with: docker compose --env-file .tag up -d
# Secrets and URLs come from .env through env_file, not through ${...}: --env-file replaces the
# default .env for interpolation.
services:
  limen:
    image: moli-limen:${APP_TAG}
    container_name: limen
    init: true
    restart: unless-stopped
    # On SIGTERM the app gives AI jobs in flight 20 seconds to finish.
    stop_grace_period: 30s
    env_file: .env
    environment:
      TZ: Asia/Kuala_Lumpur
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/healthz").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - internal
      - server-internal-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=server-internal-net
      - traefik.http.routers.limen.rule=Host(`diary.xiangyu.pro`)
      - traefik.http.routers.limen.entrypoints=websecure
      - traefik.http.services.limen.loadbalancer.server.port=3000

  postgres:
    image: postgres:18
    container_name: limen-postgres
    restart: unless-stopped
    env_file: .env # POSTGRES_PASSWORD
    environment:
      TZ: Asia/Kuala_Lumpur
      POSTGRES_DB: limen
      POSTGRES_USER: limen
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U limen -d limen']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  # A dump every BACKUP_INTERVAL_HOURS into ./backups, keeping BACKUP_KEEP_DAYS days.
  # Copy ./backups off this server as well (standard 005, 5.7.4).
  backup:
    image: postgres:18
    container_name: limen-backup
    restart: unless-stopped
    user: '1000:1000'
    env_file: .env
    environment:
      TZ: Asia/Kuala_Lumpur
      PGHOST: postgres
      PGUSER: limen
      PGDATABASE: limen
    entrypoint: ['sh', '/backup.sh']
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
  server-internal-net:
    external: true
