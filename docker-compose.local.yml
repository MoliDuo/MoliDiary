# A throwaway Postgres for development: matches .env.example's DATABASE_URL.
#   docker compose -f docker-compose.local.yml up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: moli-diary-db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
