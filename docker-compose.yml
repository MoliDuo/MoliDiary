services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: limen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: limen
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U limen -d limen']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://limen:${POSTGRES_PASSWORD}@postgres:5432/limen
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      # Believe X-Forwarded-For only when the proxy in front overwrites it.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    # Reach it through a reverse proxy that terminates HTTPS; the session
    # cookie is Secure and will not be sent over plain HTTP.
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'

  # Daily pg_dump into ./backups, newest BACKUP_KEEP_DAYS days kept.
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: limen
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: limen
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    # Run as the host user so ./backups stays readable and deletable; create
    # the directory first (mkdir backups) or Docker makes it root-owned.
    user: '${BACKUP_UID:-1000}:${BACKUP_GID:-1000}'
    entrypoint: ['sh', '/backup.sh']
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups

  # HTTPS in front of the app: `docker compose --profile proxy up -d`.
  # Caddy replaces any X-Forwarded-For the client sent, so set TRUST_PROXY=true.
  caddy:
    image: caddy:2
    profiles: ['proxy']
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
