services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: limen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: limen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U limen -d limen']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://limen:${POSTGRES_PASSWORD}@postgres:5432/limen
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      # Believe X-Forwarded-For only when the proxy in front overwrites it.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    # Reach it through a reverse proxy that terminates HTTPS; the session
    # cookie is Secure and will not be sent over plain HTTP.
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'

  # HTTPS in front of the app: `docker compose --profile proxy up -d`.
  # Caddy replaces any X-Forwarded-For the client sent, so set TRUST_PROXY=true.
  caddy:
    image: caddy:2
    profiles: ['proxy']
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
