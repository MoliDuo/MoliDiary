# Dependency updates (Moli standard 004, 4.7.1): weekly and grouped, with a 7-day cooldown so a
# freshly published release is not adopted before anyone has noticed a problem with it. Security
# fixes are grouped separately so they are never buried among the routine bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      dependencies:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The runtime is Node 24 (.nvmrc, engines, the image), so its types must not outrun it.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
